<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Join screen: name + room directory -->
  <div id="join-screen" class="screen">
    <div class="join-card">
      <div class="sign">
        <span class="sign-glow">LOBBY</span>
      </div>
      <p class="sub">Pick a name, pick a room. Anyone with the room name is in it with you.</p>

      <label class="field-label" for="name-input">Your name</label>
      <input id="name-input" type="text" placeholder="e.g. Sam" maxlength="24" autocomplete="off" />

      <label class="field-label" for="room-input">Room</label>
      <input id="room-input" type="text" placeholder="lobby" maxlength="24" autocomplete="off" />

      <button id="join-btn">Enter room</button>

      <div class="directory">
        <div class="directory-header">
          <span>Directory</span>
          <span class="directory-hint">tap a room to fill it in above</span>
        </div>
        <div id="room-list" class="room-list"></div>
      </div>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <span class="dot"></span>
        <div class="header-text">
          <span class="header-label">Room</span>
          <h1 id="room-name">lobby</h1>
        </div>
      </div>
      <div class="header-right">
        <span id="user-count">0 here</span>
        <button id="people-btn" title="See who's online">People</button>
        <button id="switch-room-btn" title="Switch room">Switch</button>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-preview-text">
        <span class="reply-preview-label">Replying to <strong id="reply-preview-name"></strong></span>
        <span id="reply-preview-snippet"></span>
      </div>
      <button id="reply-cancel-btn" type="button" aria-label="Cancel reply">×</button>
    </div>

    <div id="image-preview" class="image-preview hidden">
      <img id="image-preview-thumb" alt="Attached image preview" />
      <button id="image-cancel-btn" type="button" aria-label="Remove image">×</button>
    </div>

    <form id="message-form" class="composer">
      <input id="file-input" type="file" accept="image/*" class="visually-hidden" />
      <button type="button" id="attach-btn" class="icon-btn" title="Attach image" aria-label="Attach image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input id="message-input" type="text" placeholder="Type a message…" maxlength="500" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- People panel: who's online in this room -->
  <div id="people-panel" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-header">
        <h2>People in this room</h2>
        <button id="people-close-btn" class="overlay-close" aria-label="Close">×</button>
      </div>
      <div id="people-list" class="people-list"></div>
    </div>
  </div>

  <!-- DM screen: private 1:1 conversation -->
  <div id="dm-screen" class="screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <button id="dm-back-btn" class="icon-btn" title="Back to room" aria-label="Back to room">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="header-text">
          <span class="header-label">Direct message</span>
          <h1 id="dm-name">—</h1>
        </div>
      </div>
    </header>

    <main id="dm-messages" class="messages"></main>

    <div id="dm-image-preview" class="image-preview hidden">
      <img id="dm-image-preview-thumb" alt="Attached image preview" />
      <button id="dm-image-cancel-btn" type="button" aria-label="Remove image">×</button>
    </div>

    <form id="dm-form" class="composer">
      <input id="dm-file-input" type="file" accept="image/*" class="visually-hidden" />
      <button type="button" id="dm-attach-btn" class="icon-btn" title="Attach image" aria-label="Attach image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input id="dm-input" type="text" placeholder="Message…" maxlength="500" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
